name: Padel Watcher

on:
  schedule:
    - cron: '*/15 * * * *'  # Elke 15 minuten
  workflow_dispatch:

concurrency:
  group: padel-watcher-check
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      moet_reserveren: ${{ steps.check.outputs.moet_reserveren }}
      wacht_seconden: ${{ steps.check.outputs.wacht_seconden }}
      opent_iso: ${{ steps.check.outputs.opent_iso }}
      speel_datum_tijd: ${{ steps.check.outputs.speel_datum_tijd }}
      partners: ${{ steps.check.outputs.partners }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Bepaal of we moeten voorbereiden
        id: check
        run: |
          python3 << 'PYEOF'
          import os, sys, json
          from datetime import datetime, timedelta
          from zoneinfo import ZoneInfo

          NL = ZoneInfo("Europe/Amsterdam")
          VOORBEREIDING = timedelta(minutes=3)  # tijd om in te loggen/partners toe te voegen vóór opening

          bestand = "reserveringen.json"
          if not os.path.exists(bestand):
              print("Geen reserveringen gepland.")
              with open(os.environ["GITHUB_OUTPUT"], "a") as f:
                  f.write("moet_reserveren=nee\n")
              sys.exit(0)

          with open(bestand) as f:
              reserveringen = json.load(f)

          open_res = [r for r in reserveringen if not r.get("gedaan")]
          if not open_res:
              print("Alle reserveringen al gedaan.")
              with open(os.environ["GITHUB_OUTPUT"], "a") as f:
                  f.write("moet_reserveren=nee\n")
              sys.exit(0)

          nu = datetime.now(tz=NL)
          print(f"[{nu.strftime('%d-%m-%Y %H:%M')}] {len(open_res)} open reservering(en):")

          te_doen = None
          te_doen_opent = None
          for r in open_res:
              tekst = r["speeltijd"].strip()
              for fmt in ("%d-%m-%Y %H:%M", "%Y-%m-%d %H:%M"):
                  try:
                      speeltijd = datetime.strptime(tekst, fmt).replace(tzinfo=NL)
                      break
                  except ValueError:
                      continue

              opent                     = speeltijd - timedelta(hours=36)
              seconden_tot_voorbereiding = (opent - VOORBEREIDING - nu).total_seconds()
              seconden_sinds_open       = (nu - opent).total_seconds()

              if seconden_tot_voorbereiding > 5 * 3600:
                  print(f"  - {tekst}: nog {int(seconden_tot_voorbereiding/3600)} uur tot voorbereiding (opent {opent.strftime('%d-%m %H:%M')})")
              elif seconden_sinds_open > 24 * 3600:
                  print(f"  - {tekst}: te oud ({int(seconden_sinds_open/3600)} uur geleden) - overgeslagen")
              else:
                  te_doen       = r
                  te_doen_opent = opent
                  break

          if te_doen:
              wacht_seconden = max(0, int((te_doen_opent - VOORBEREIDING - nu).total_seconds()))
              print(f"  -> {te_doen['speeltijd']}: wacht {wacht_seconden}s tot voorbereidingsmoment, opent om {te_doen_opent.strftime('%d-%m %H:%M:%S')}")
              with open(os.environ["GITHUB_OUTPUT"], "a") as f:
                  f.write("moet_reserveren=ja\n")
                  f.write(f"wacht_seconden={wacht_seconden}\n")
                  f.write(f"opent_iso={te_doen_opent.isoformat()}\n")
                  f.write(f"speel_datum_tijd={te_doen['speeltijd']}\n")
                  f.write(f"partners={te_doen.get('partners','')}\n")
          else:
              with open(os.environ["GITHUB_OUTPUT"], "a") as f:
                  f.write("moet_reserveren=nee\n")
          PYEOF

  reserveer:
    needs: check
    if: needs.check.outputs.moet_reserveren == 'ja'
    runs-on: ubuntu-latest
    timeout-minutes: 350
    permissions:
      contents: write
    concurrency:
      group: padel-reserveer-${{ needs.check.outputs.speel_datum_tijd }}
      cancel-in-progress: false

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Check of intussen al gedaan
        id: nogcheck
        env:
          SPEEL_DATUM_TIJD: ${{ needs.check.outputs.speel_datum_tijd }}
        run: |
          git fetch origin main -q
          git reset --hard origin/main -q

          python3 << 'PYEOF'
          import json, os
          tekst = os.environ["SPEEL_DATUM_TIJD"].strip()
          bestand = "reserveringen.json"
          reserveringen = json.load(open(bestand)) if os.path.exists(bestand) else []
          al_gedaan = any(r["speeltijd"].strip() == tekst and r.get("gedaan") for r in reserveringen)
          with open(os.environ["GITHUB_OUTPUT"], "a") as f:
              f.write(f"al_gedaan={'ja' if al_gedaan else 'nee'}\n")
          print(f"Al gedaan (bijv. door directe app-aanvraag terwijl watcher wachtte): {al_gedaan}")
          PYEOF

      - name: Python + Playwright installeren
        if: steps.nogcheck.outputs.al_gedaan != 'ja'
        run: |
          pip install playwright -q
          playwright install chromium
          playwright install-deps chromium
          sudo apt-get install -y xvfb

      - name: Wacht tot voorbereidingsmoment
        if: steps.nogcheck.outputs.al_gedaan != 'ja'
        run: |
          echo "Wacht ${{ needs.check.outputs.wacht_seconden }}s tot voorbereidingsmoment..."
          sleep ${{ needs.check.outputs.wacht_seconden }}

      - name: Reserveren
        if: steps.nogcheck.outputs.al_gedaan != 'ja'
        env:
          KNLTB_GEBRUIKERSNUMMER: ${{ secrets.KNLTB_GEBRUIKERSNUMMER }}
          KNLTB_WACHTWOORD: ${{ secrets.KNLTB_WACHTWOORD }}
          KNLTB_WEBSITE: ${{ secrets.KNLTB_WEBSITE }}
          INTRODUCEE_EMAIL: ${{ secrets.INTRODUCEE_EMAIL }}
          SPEEL_DATUM_TIJD: ${{ needs.check.outputs.speel_datum_tijd }}
          PARTNERS: ${{ needs.check.outputs.partners }}
          OPENT_ISO: ${{ needs.check.outputs.opent_iso }}
          KNLTB_SESSION_STATE: ${{ secrets.KNLTB_SESSION_STATE }}
          PYTHONUNBUFFERED: "1"
        run: xvfb-run --auto-servernum python padel_reserveer.py

      - name: Upload screenshot bij falen
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: padel-screenshot
          path: /tmp/padel_screenshot.png
          retention-days: 3

      - name: Upload diagnose bij niet-gevonden partner
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: padel-partner-niet-gevonden
          path: /tmp/partner_niet_gevonden_*.png
          if-no-files-found: ignore
          retention-days: 3

      - name: Markeer als gedaan (met retry)
        if: success() && steps.nogcheck.outputs.al_gedaan != 'ja'
        env:
          SPEEL_DATUM_TIJD: ${{ needs.check.outputs.speel_datum_tijd }}
          PARTNERS: ${{ needs.check.outputs.partners }}
        run: |
          git config user.name "github-actions"
          git config user.email "actions@github.com"

          gelukt=0
          for poging in 1 2 3 4 5; do
            git fetch origin main -q
            git reset --hard origin/main -q

            python3 << 'PYEOF'
          import json, os
          tekst    = os.environ.get("SPEEL_DATUM_TIJD", "").strip()
          partners = os.environ.get("PARTNERS", "").strip()
          bestand  = "reserveringen.json"
          reserveringen = json.load(open(bestand)) if os.path.exists(bestand) else []
          for r in reserveringen:
              if r["speeltijd"].strip() == tekst:
                  r["gedaan"] = True
                  break
          else:
              reserveringen.append({"speeltijd": tekst, "partners": partners, "gedaan": True})
          with open(bestand, "w") as f:
              json.dump(reserveringen, f, indent=2)
          print(f"Opgeslagen als gedaan: {tekst}")
          PYEOF

            git add reserveringen.json
            if git diff --cached --quiet; then
              echo "Geen wijziging nodig (poging $poging)."
              gelukt=1
              break
            fi

            git commit -m "Reservering uitgevoerd: ${{ needs.check.outputs.speel_datum_tijd }}"

            if git push origin HEAD:main; then
              echo "Gepusht (poging $poging)."
              gelukt=1
              break
            fi

            echo "Push mislukt (poging $poging) - iemand anders was sneller, opnieuw proberen..."
            sleep $(( (RANDOM % 4) + 1 ))
          done

          if [ "$gelukt" != "1" ]; then
            echo "::error::Kon reserveringen.json niet bijwerken na 5 pogingen (blijvende conflicten)."
            exit 1
          fi
