name: Plan Reservering

on:
  workflow_dispatch:
    inputs:
      speel_datum_tijd:
        description: "Speeldag + tijd (DD-MM-YYYY HH:MM)"
        required: true
      partners:
        description: "Partners (kommagescheiden)"
        required: false
        default: ""

concurrency:
  group: padel-reserveer-${{ github.event.inputs.speel_datum_tijd }}
  cancel-in-progress: false

jobs:
  plan_en_reserveer:
    runs-on: ubuntu-latest
    timeout-minutes: 350  # max ~6 uur wachten + reserveren
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Bereken wachttijd
        id: bereken
        env:
          SPEEL_DATUM_TIJD: ${{ github.event.inputs.speel_datum_tijd }}
          PARTNERS: ${{ github.event.inputs.partners }}
        run: |
          python3 << 'PYEOF'
          import os, json
          from datetime import datetime, timedelta
          from zoneinfo import ZoneInfo

          NL       = ZoneInfo("Europe/Amsterdam")
          tekst    = os.environ["SPEEL_DATUM_TIJD"].strip()
          partners = os.environ.get("PARTNERS", "").strip()

          for fmt in ("%d-%m-%Y %H:%M", "%Y-%m-%d %H:%M"):
              try:
                  speeltijd = datetime.strptime(tekst, fmt).replace(tzinfo=NL)
                  break
              except ValueError:
                  continue

          VOORBEREIDING = timedelta(minutes=3)
          opent = speeltijd - timedelta(hours=36)
          nu    = datetime.now(tz=NL)
          seconden_tot_voorbereiding = (opent - VOORBEREIDING - nu).total_seconds()

          print(f"Speeltijd:         {speeltijd.strftime('%d-%m-%Y om %H:%M')}")
          print(f"Partners:          {partners or '(geen)'}")
          print(f"Reservering opent: {opent.strftime('%d-%m-%Y om %H:%M')} NL")
          print(f"Nu:                {nu.strftime('%d-%m-%Y om %H:%M')} NL")

          vijf_uur = 5 * 3600

          if seconden_tot_voorbereiding <= vijf_uur:
              # Opening (bijna) binnen bereik - deze run wacht en reserveert zelf
              wacht_seconden = max(0, int(seconden_tot_voorbereiding))
              print(f"\nVoorbereiding over {wacht_seconden}s - deze run reserveert zelf.")
              with open(os.environ["GITHUB_OUTPUT"], "a") as f:
                  f.write("actie=reserveer_nu\n")
                  f.write(f"wacht_seconden={wacht_seconden}\n")
                  f.write(f"opent_iso={opent.isoformat()}\n")

          else:
              # Opening verder dan 5 uur weg - sla op voor watcher
              uren = int(seconden_tot_voorbereiding / 3600)
              print(f"\nOpening over {uren} uur - sla op voor automatische watcher...")

              bestand = "reserveringen.json"
              if os.path.exists(bestand):
                  with open(bestand) as f:
                      reserveringen = json.load(f)
              else:
                  reserveringen = []

              # Voorkom duplicaten
              al_gepland = any(r["speeltijd"].strip() == tekst for r in reserveringen)
              if not al_gepland:
                  reserveringen.append({
                      "speeltijd": tekst,
                      "partners": partners,
                      "gedaan": False
                  })
                  with open(bestand, "w") as f:
                      json.dump(reserveringen, f, indent=2)
                  print(f"Opgeslagen. Watcher reserveert automatisch op {opent.strftime('%d-%m-%Y om %H:%M')}.")
                  with open(os.environ["GITHUB_OUTPUT"], "a") as f:
                      f.write("actie=opgeslagen\n")
              else:
                  print(f"Stond al ingepland — geen actie nodig.")
                  with open(os.environ["GITHUB_OUTPUT"], "a") as f:
                      f.write("actie=geen\n")

              print(f"\nAlle geplande reserveringen:")
              for i, r in enumerate(reserveringen, 1):
                  status = "GEDAAN" if r["gedaan"] else "wachtend"
                  print(f"  {i}. {r['speeltijd']} [{status}]")
          PYEOF

      - name: Commit opgeslagen reservering
        if: steps.bereken.outputs.actie == 'opgeslagen'
        run: |
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git add reserveringen.json
          git pull --rebase --autostash
          git diff --cached --quiet || git commit -m "Reservering gepland: ${{ github.event.inputs.speel_datum_tijd }}"
          git diff --cached --quiet || true
          git push || true

      - name: Sla direct op als wachtend
        if: steps.bereken.outputs.actie == 'reserveer_nu'
        env:
          SPEEL_DATUM_TIJD: ${{ github.event.inputs.speel_datum_tijd }}
          PARTNERS: ${{ github.event.inputs.partners }}
        run: |
          python3 << 'PYEOF'
          import json, os
          tekst    = os.environ["SPEEL_DATUM_TIJD"].strip()
          partners = os.environ.get("PARTNERS", "").strip()
          bestand  = "reserveringen.json"
          reserveringen = json.load(open(bestand)) if os.path.exists(bestand) else []
          if not any(r["speeltijd"].strip() == tekst for r in reserveringen):
              reserveringen.append({"speeltijd": tekst, "partners": partners, "gedaan": False})
              with open(bestand, "w") as f:
                  json.dump(reserveringen, f, indent=2)
              print(f"Opgeslagen als wachtend: {tekst}")
          PYEOF
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git add reserveringen.json
          git pull --rebase --autostash
          git diff --cached --quiet || git commit -m "Reservering gestart: ${{ github.event.inputs.speel_datum_tijd }}"
          git push || true

      - name: Python + Playwright installeren
        if: steps.bereken.outputs.actie == 'reserveer_nu'
        run: |
          pip install playwright -q
          playwright install chromium
          playwright install-deps chromium
          sudo apt-get install -y xvfb

      - name: Wacht tot voorbereidingsmoment
        if: steps.bereken.outputs.actie == 'reserveer_nu'
        run: |
          echo "Wacht ${{ steps.bereken.outputs.wacht_seconden }}s tot voorbereidingsmoment..."
          sleep ${{ steps.bereken.outputs.wacht_seconden }}

      - name: Reserveren
        if: steps.bereken.outputs.actie == 'reserveer_nu'
        env:
          KNLTB_GEBRUIKERSNUMMER: ${{ secrets.KNLTB_GEBRUIKERSNUMMER }}
          KNLTB_WACHTWOORD: ${{ secrets.KNLTB_WACHTWOORD }}
          KNLTB_WEBSITE: ${{ secrets.KNLTB_WEBSITE }}
          INTRODUCEE_EMAIL: ${{ secrets.INTRODUCEE_EMAIL }}
          SPEEL_DATUM_TIJD: ${{ github.event.inputs.speel_datum_tijd }}
          PARTNERS: ${{ github.event.inputs.partners }}
          OPENT_ISO: ${{ steps.bereken.outputs.opent_iso }}
          KNLTB_SESSION_STATE: ${{ secrets.KNLTB_SESSION_STATE }}
          PYTHONUNBUFFERED: "1"
        run: xvfb-run --auto-servernum python padel_reserveer.py

      - name: Upload screenshots
        if: always() && steps.bereken.outputs.actie == 'reserveer_nu'
        uses: actions/upload-artifact@v4
        with:
          name: padel-screenshots
          path: /tmp/partners_debug.png
          retention-days: 3

      - name: Upload screenshot bij falen
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: padel-screenshot-fout
          path: /tmp/padel_screenshot.png
          retention-days: 3

      - name: Sla reservering op als gedaan
        if: success() && steps.bereken.outputs.actie == 'reserveer_nu'
        env:
          SPEEL_DATUM_TIJD: ${{ github.event.inputs.speel_datum_tijd }}
          PARTNERS: ${{ github.event.inputs.partners }}
        run: |
          python3 << 'PYEOF'
          import json, os
          tekst    = os.environ["SPEEL_DATUM_TIJD"].strip()
          partners = os.environ.get("PARTNERS", "").strip()
          bestand  = "reserveringen.json"
          reserveringen = json.load(open(bestand)) if os.path.exists(bestand) else []
          for r in reserveringen:
              if r["speeltijd"].strip() == tekst:
                  r["gedaan"] = True
                  break
          else:
              reserveringen.append({"speeltijd": tekst, "partners": partners, "gedaan": True})
          with open(bestand, "w") as f:
              json.dump(reserveringen, f, indent=2)
          print(f"Opgeslagen als gedaan: {tekst}")
          PYEOF
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git add reserveringen.json
          git pull --rebase --autostash
          git commit -m "Reservering uitgevoerd: ${{ github.event.inputs.speel_datum_tijd }}"
          git push
