name: Plan Reservering

on:
  workflow_dispatch:
    inputs:
      speel_datum_tijd:
        description: "Speeldag + tijd (DD-MM-YYYY HH:MM)
          Bijv: 17-04-2026 13:30"
        required: true
      partners:
        description: "Partners (kommagescheiden)
          Bijv: Ron de Wit,Roos de Bruijne"
        required: false
        default: ''

jobs:
  plan:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Sla reservering op
        env:
          SPEEL_DATUM_TIJD: ${{ github.event.inputs.speel_datum_tijd }}
          PARTNERS: ${{ github.event.inputs.partners }}
        run: |
          python3 << 'PYEOF'
          import os
          from datetime import datetime, timedelta
          from zoneinfo import ZoneInfo

          NL    = ZoneInfo("Europe/Amsterdam")
          tekst = os.environ["SPEEL_DATUM_TIJD"]
          partners = os.environ.get("PARTNERS", "")

          for fmt in ("%d-%m-%Y %H:%M", "%Y-%m-%d %H:%M"):
              try:
                  speeltijd = datetime.strptime(tekst.strip(), fmt).replace(tzinfo=NL)
                  break
              except ValueError:
                  continue

          opent = speeltijd - timedelta(hours=36)
          print("=" * 45)
          print(f"Speeltijd:         {speeltijd.strftime('%d-%m-%Y om %H:%M')}")
          print(f"Partners:          {partners or '(geen)'}")
          print(f"Reservering opent: {opent.strftime('%d-%m-%Y om %H:%M')} NL")
          print("=" * 45)
          print("Watcher checkt elke 30 min. Jij hoeft niets te doen!")

          with open("reservering.env", "w") as f:
              f.write(f"SPEEL_DATUM_TIJD={tekst}\n")
              f.write(f"PARTNERS={partners}\n")
              f.write("GEDAAN=nee\n")
          PYEOF

      - name: Commit
        run: |
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git add reservering.env
          git commit -m "Reservering: ${{ github.event.inputs.speel_datum_tijd }}"
          git push
