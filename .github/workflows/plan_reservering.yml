name: Plan Reservering

on:
  workflow_dispatch:
    inputs:
      speel_datum_tijd:
        description: "Speeldag + tijd (DD-MM-YYYY HH:MM)"
        required: true
      partners:
        description: "Partners (kommagescheiden)"
        required: false
        default: ''

jobs:
  plan:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Voeg reservering toe
        env:
          SPEEL_DATUM_TIJD: ${{ github.event.inputs.speel_datum_tijd }}
          PARTNERS: ${{ github.event.inputs.partners }}
        run: |
          python3 << 'PYEOF'
          import os, json
          from datetime import datetime, timedelta
          from zoneinfo import ZoneInfo

          NL       = ZoneInfo("Europe/Amsterdam")
          tekst    = os.environ["SPEEL_DATUM_TIJD"].strip()
          partners = os.environ.get("PARTNERS", "").strip()

          for fmt in ("%d-%m-%Y %H:%M", "%Y-%m-%d %H:%M"):
              try:
                  speeltijd = datetime.strptime(tekst, fmt).replace(tzinfo=NL)
                  break
              except ValueError:
                  continue

          opent = speeltijd - timedelta(hours=36)

          # Laad bestaande reserveringen
          bestand = "reserveringen.json"
          if os.path.exists(bestand):
              with open(bestand) as f:
                  reserveringen = json.load(f)
          else:
              reserveringen = []

          # Voeg nieuwe toe
          reserveringen.append({
              "speeltijd": tekst,
              "partners": partners,
              "gedaan": False
          })

          with open(bestand, "w") as f:
              json.dump(reserveringen, f, indent=2)

          print("=" * 45)
          print(f"Toegevoegd:        {tekst}")
          print(f"Partners:          {partners or '(geen)'}")
          print(f"Reservering opent: {opent.strftime('%d-%m-%Y om %H:%M')} NL")
          print(f"Totaal gepland:    {len(reserveringen)} reservering(en)")
          print("=" * 45)
          for i, r in enumerate(reserveringen, 1):
              status = "GEDAAN" if r["gedaan"] else "wachtend"
              print(f"  {i}. {r['speeltijd']} - {r['partners'] or '(geen partners)'} [{status}]")
          PYEOF

      - name: Commit
        run: |
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git add reserveringen.json
          git commit -m "Reservering toegevoegd: ${{ github.event.inputs.speel_datum_tijd }}"
          git push
